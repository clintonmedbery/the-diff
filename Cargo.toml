[package]
name = "the-diff"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for staging, unstaging, and discarding git changes hunk by hunk"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clintonmedbery/the-diff"
readme = "README.md"
keywords = ["git", "tui", "diff", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "the-diff"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
